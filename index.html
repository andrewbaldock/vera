<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />

    <!--
      Installable, because this gets opened on a phone to be tested on a phone.
      iOS ignores SVG favicons for the home screen and will otherwise use a
      screenshot of the page as the icon, so apple-touch-icon is not optional.

      `display: browser` on purpose, and `apple-mobile-web-app-capable` is
      deliberately absent -- either one would open this in a standalone window,
      and a standalone window has no share sheet and no address bar, which is
      where iOS keeps Find on Page. Whole-document search is acceptance
      criterion #1, so the browser chrome is load-bearing here. The home-screen
      icon is still ours; it just launches into Safari.

      No service worker: it would be a box tick. The app is one screen backed by
      a live review, and serving a stale verdict offline would be worse than
      saying nothing.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="VERA" />
    <meta name="application-name" content="VERA" />
    <meta name="description" content="Review an automated document check and decide whether it can be submitted." />
    <!-- Two, so the browser chrome follows the theme instead of fighting it. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#252525" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers on iOS. Without it the bottom bar sits under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Public name. Codename VERA stays in the code; see src/lib/brand.ts -->
    <title>VERA — Document Review</title>
    <script>
      // Runs before first paint. Without it a dark-mode user gets a white flash
      // on every load, because React can't apply the class until it mounts.
      // Deliberately duplicated logic — it has to be inline to be early enough,
      // and the duplicate is four lines rather than an import.
      try {
        var pref = localStorage.getItem('vera.theme') || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        // Same reasoning, different symptom: the interface size is the root
        // font size, so applying it after mount reflows the entire layout in
        // front of the reader. Validated here because this value becomes an
        // attribute selector.
        var size = localStorage.getItem('vera.uiScale')
        document.documentElement.dataset.uiScale =
          size === 'compact' || size === 'large' ? size : 'comfortable'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
